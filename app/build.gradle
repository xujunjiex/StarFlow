plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.moe.starflow'
    compileSdk 35

    aaptOptions {
        noCompress 'onnx', 'tflite'
    }

    defaultConfig {
        applicationId "com.moe.starflow"
        minSdk 29
        targetSdk 35
        versionCode 1100
        versionName "0.11.0"

        externalNativeBuild {
            cmake {
                cppFlags ''
                abiFilters 'arm64-v8a'
            }
        }

        ndk {
            abiFilters 'arm64-v8a' // 只包含 arm64-v8a
        }
    }

    // 添加全局 NDK 配置
    ndkVersion "25.2.9519653"  // 使用项目中的 NDK 版本

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug

            ndk {
                abiFilters 'arm64-v8a' // 发布包只包含 arm64-v8a
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    testOptions {
        unitTests.returnDefaultValues = true
        // 让 Robolectric 单测能访问 res 布局/资源（LanguageSelectionDialog 等 UI 交互测试需要 inflate XML）
        unitTests.includeAndroidResources = true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            excludes += ['**/libsentencepiece_train.so']
        }
    }

    // 本地化防漂移：缺失翻译在构建期直接失败。
    // 本项目是「values(英文默认) + values-zh(中文)」双份手工同步，历史上堆积了 82 个 key
    // 只存在于 values/ → 中文界面回退英文（中英混杂且长期无人发现）。
    // 用 fatal 而非 error：仓库另有 27 个历史 error 级问题（NewApi/UnusedResources 等）会把
    // `./gradlew lint` 整体染红、淹没新问题；而 fatal 级会被 lintVitalRelease 单独拦下，
    // 即「release 构建因缺翻译而失败」——这正是想要的硬门槛（当前 MissingTranslation 命中 0，构建正常）。
    lint {
        fatal += ['MissingTranslation']
    }
}

dependencies {
    // 核心依赖
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    /*
    待解决：
    com.google.android.material:material
    1.5.0正常波纹效果，更新至1.12.0消失，且首页字体加粗。
    */
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // 导航Fragment组件
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.4'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.4'

    // 带有生命周期的Service
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    // JetPack的preference库
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // OKHttp网络库
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'

    // 颜色选择
    implementation 'com.jaredrummler:colorpicker:1.1.0'

    // ML Kit的OCR识别库
    // 中文识别
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // 英文识别（拉丁字母）
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // 日文识别
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    // 韩文识别
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'

    // 模型ONNX的运行时库
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.0'  //latest.release
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.12.4'   //latest.release

    // XML文件解析
    implementation group: 'xerces', name: 'xercesImpl', version: '2.12.0'

    // 撒花效果组件
    implementation 'nl.dionsegijn:konfetti-xml:2.0.5'

    // 图片处理
    implementation 'com.github.bumptech.glide:glide:4.12.0'

    // Guava库
    implementation("com.google.guava:guava:33.3.1-android")

    // JTS 多边形偏移库（替代 pyclipper 的 Vatti clipping）
    implementation 'org.locationtech.jts:jts-core:1.19.0'

    // Room 数据库
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"

    // 单元测试
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'
}