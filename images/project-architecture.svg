<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" role="img" aria-labelledby="title desc">
  <title id="title">StarFlow 项目结构</title>
  <desc id="desc">主要界面与业务位于 app 模块，使用 ONNX Runtime 和 ML Kit，依赖 llamacpp 与 sr 两个原生模块，并通过网络调用在线翻译和对话服务。分组表示功能归属，实线表示 Gradle 模块依赖，虚线表示在线调用。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path class="arrowhead" d="M0 0 L10 4 L0 8Z"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #242424; }
      rect { fill: none; stroke: #909090; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 17px; }
      .note { font-size: 15px; fill: #626262; }
      .edge { fill: none; stroke: #707070; stroke-width: 2; marker-end: url(#arrow); }
      .arrowhead { fill: #707070; }
      @media (prefers-color-scheme: dark) {
        text { fill: #e6e6e6; }
        .note { fill: #b0b0b0; }
        rect, .edge { stroke: #909090; }
        .arrowhead { fill: #909090; }
      }
    </style>
  </defs>
  <text x="32" y="43" class="heading">StarFlow 项目结构</text>
  <text x="32" y="70" class="note">Kotlin / Java / C++ · Android Views · ViewBinding · Material · Navigation · 协程</text>

  <rect x="32" y="94" width="1016" height="468" rx="4" stroke-width="1.5"/>
  <text x="56" y="130" class="label">:app — Android 应用与主要业务</text>

  <text x="56" y="168" class="note">功能入口</text>
  <rect x="56" y="182" width="304" height="78" rx="4"/>
  <text x="76" y="213" class="label">游戏 / 视频 / 漫画截图翻译</text>
  <text x="76" y="240" class="body">translate/ · manga/</text>
  <rect x="388" y="182" width="304" height="78" rx="4"/>
  <text x="408" y="213" class="label">漫画与小说书架、阅读器</text>
  <text x="408" y="240" class="body">mangaimport/ · novel/</text>
  <rect x="720" y="182" width="304" height="78" rx="4"/>
  <text x="740" y="213" class="label">文本翻译与模型对话</text>
  <text x="740" y="240" class="body">translate/ · chat/</text>

  <text x="56" y="295" class="note">处理能力与模型管理</text>
  <rect x="56" y="309" width="968" height="83" rx="4"/>
  <text x="76" y="340" class="label">OCR / 检测 / 排版渲染 · 翻译适配 · 对话引擎 · 图片超分 · 模型下载</text>
  <text x="76" y="369" class="body">ONNX Runtime：PP-OCR、RT-DETR、MangaOCR、NLLB；ML Kit：文字识别</text>

  <text x="56" y="427" class="note">数据与应用内原生代码</text>
  <rect x="56" y="441" width="968" height="94" rx="4"/>
  <text x="76" y="474" class="body">library/ · data/：书库、阅读进度、翻译历史与处理记录</text>
  <text x="76" y="507" class="body">Room · 文件 / SAF · SharedPreferences；SentencePiece 由 :app 的 CMake 编译</text>

  <path d="M208 562 V625" class="edge"/>
  <text x="220" y="599" class="note">模块依赖</text>
  <path d="M540 562 V625" class="edge"/>
  <text x="552" y="599" class="note">模块依赖</text>
  <path d="M872 562 V625" class="edge" stroke-dasharray="6 5"/>
  <text x="884" y="599" class="note">在线调用</text>

  <rect x="56" y="627" width="304" height="112" rx="4"/>
  <text x="76" y="660" class="label">:llamacpp</text>
  <text x="76" y="690" class="body">llama.cpp + JNI</text>
  <text x="76" y="717" class="body">本地 GGUF 翻译与对话</text>
  <rect x="388" y="627" width="304" height="112" rx="4"/>
  <text x="408" y="660" class="label">:sr</text>
  <text x="408" y="690" class="body">ncnn + JNI</text>
  <text x="408" y="717" class="body">图片超分 · Vulkan / CPU</text>
  <rect x="720" y="627" width="304" height="112" rx="4"/>
  <text x="740" y="660" class="label">外部在线服务</text>
  <text x="740" y="690" class="body">机器翻译 · OpenAI 兼容接口</text>
  <text x="740" y="717" class="body">图片翻译 · 自定义接口</text>

  <text x="32" y="778" class="note">框内分组表示功能归属；实线为 Gradle 模块依赖，虚线为网络调用。仅 :app、:llamacpp、:sr 是工程模块。</text>
</svg>
